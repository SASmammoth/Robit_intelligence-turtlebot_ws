drive_node:
  ros__parameters:
    drive:

      pivot_enter_deg: 100     # 코너가 이보다 크게 꺾일 때만 피봇. 가변 lookahead와 같이 쓰면 100° 아래는 피봇 없이가 더 안정적 (test/turn_sim)
      pivot_keep_deg: 20       # 이만큼은 전진하며 돌고 초과분만 제자리 회전. 줄이면 정확, 늘리면 피봇이 짧음
      pivot_confirm: 3         # 코너가 이만큼 연속(제어 주기)으로 보여야 피봇. 흔들림으로 생기는 가짜 코너 거르기
      pivot_exit_deg: 15
      pivot_w_deg_s: 90
      pivot_fallback_deg: 75   # 코너를 못 찾았는데 목표점이 이보다 옆이면 바로 피봇 (놓치기 직전 안전장치)
      corner_min_x_mm: 200     # 이보다 가까운 경로(사각지대 채운 구간)에서는 코너를 찾지 않음 = geo.bev_bottom_mm 근처

      # ── 안전
      enable: false          # 켜기 전까지 항상 0 발행. GUI나 ros2 param set으로 켬
      require_cmd: false     # 대회: true (tb_brain 없으면 정지). 차선만 테스트: false
      latency_comp: false    # /odom 생기면 true
      control_hz: 30

      # ── 속도 (★ 직접 정해야 함)
      v_max_mm_s: 300        # 실차 확인 (보정 후 실제 속도)
      v_min_mm_s: 40         # 모터가 실제로 굴러가는 최저 속도
      v_curve_mm_s: 0        # 코너 속도 상한. 0 = 끔. 켜면 직선은 v_max, 코너는 v_max와 상관없이 이 값 (예: v_max 400, v_curve 200)
      curve_start_deg: 20    # 앞 경로(lookahead + 제동거리)가 이보다 덜 틀어지면 v_max
      curve_full_deg: 60     # 이만큼 틀어지면 v_curve (그 사이는 비례). 반경 26cm 곡선은 앞 35cm에서 약 77°
      w_max_deg_s: 90        # 바퀴 최고 속도에서 계산 (README 참고)
      accel_mm_s2: 300
      decel_mm_s2: 600
      w_accel_deg_s2: 360

      # ── 경로 추종
      ld_min_mm: 170         # ★ 실차 확인. 사각지대 채움(path.fill_blind)을 켠 상태 기준
      ld_max_mm: 350         # ★ 카메라가 보는 가장 먼 거리보다 짧게
      ld_time_ms: 1000       # lookahead = 속도 × 이 시간
      ld_sharp_mm: 120       # ★ 급한 곳(교차로, 벽돌)에서 줄일 lookahead. 0이면 끔
      sharp_turn_deg: 60     # 교차로 명령(/mission/turn≠0) 중: 앞 35cm 경로가 이만큼 틀어지면 ld_sharp를 다 씀 (0°부터 비례)
      sharp_curve_start_deg: 85  # 명령 없을 때(일반 곡선): 이보다 덜 틀어지면 lookahead를 안 줄임 (실측 일반 곡선 최대 ~75°, T ~105°+)
      sharp_curve_full_deg: 105  # 명령 없을 때: 이만큼 틀어지면 ld_sharp를 다 씀
      curve_x_offset_mm: 0       # 일반 주행(교차로 명령·공사 아님)에서 경로 x에 더함. bev_bottom 실측 205를 130으로 쓰면 75
      sharp_hold_ms: 1000    # 급한 곳을 본 뒤 이 시간 동안은 짧게 유지 (코너를 빠져나올 때까지)
      sharp_hold_mm: 0       # >0이면 시간 대신 이 거리 동안 유지 (속도를 바꿔도 같은 구간). 지금 1000ms는 300mm/s에서 약 300mm
      curv_slow_mm: 100      # 커브 감속 세기 (0이면 감속 없음). v = 상한 / (1 + curv_slow·곡률), 상한 = v_max 또는 코너면 v_curve
      stop_dist_mm: 40       # 경로 끝까지 이만큼 남으면 정지

      # ── 타임아웃
      path_timeout_ms: 400   # 이보다 오래된 /lane/path는 버림
      hold_ms: 600           # 경로가 비면 마지막 경로를 추측항법으로 이만큼 더 따라감
      cmd_timeout_ms: 500    # /drive/cmd 유효 시간
      weak_src_pct: 60       # path_source가 memory/color_rule이면 속도를 이 %로
      # ── 공사 구간 (/lane/construction이 켜지면 아래 값으로 바뀜. 경로는 일반 주행과 같음)
      con_v_mm_s: 100          # 최고 속도
      con_ld_min_mm: 250       # 최소 lookahead. 길게 = 멀리 보고 ㄱ자 경로를 미리 완만하게 꺾음 (120은 늦게 꺾어 벽돌에 박음)
      con_turn_gain_pct: 130   # 회전 세기 %. lookahead는 그대로 두고 도는 반경만 줄임 (130 → 0.77배). 벽돌 안쪽을 깎으면 낮춤
      con_ld_sharp_mm: 0       # 급한 곳 lookahead. 0 = 공사 구간에서는 안 줄임
      con_pivot_enter_deg: 180 # 피봇 시작 각도. 180 = 코너 피봇 안 함 (60은 곡선에서도 걸리고, 벽돌 옆 피봇은 뒤가 쓸림)
      con_pivot_keep_deg: 15   # 이만큼은 전진하며 돌고 초과분만 피봇

      # ── PSD 비상정지 (★ STM32 브리지가 Range 토픽을 내면 켜기)
      psd:
        enable: false
        stop_mm: 150
        topics: ["/psd/front"]

      # ── 모터 출력: TB_Uart_RX "velocity L R" (다이나믹셀 원시값)
      #    1 m/s ≈ 878, 0.15 m/s ≈ 132
      uart:
        enable: true
        wheel_radius_m: 0.0475
        rpm_per_unit: 0.43     # 실측 보정: 직진 0.1m/s × 5s → 51cm (기존 0.229는 약 1.9배 빠름)
        wheel_sep_m: 0.193     # 실측 보정: 원호 (v 0.1, w 0.385, 4.1초 → 80°). 전진하며 돌 때 쓰임
        pivot_sep_m: 0.165     # 실측 보정: 제자리 회전 2바퀴. 안쪽 바퀴가 거꾸로 돌 때 이쪽으로 섞임
        max_raw: 275            # MX-64 12V 무부하 약 63rpm. 넘으면 L/R 비율 유지하며 축소
        invert_left: false      # GUI WASD와 같은 규칙(전진 = 둘 다 양수)이면 false
        invert_right: false
