path_node:
  ros__parameters:
    skel:
      seal_len: 30          # 끊긴 차선 끝 연장 (BEV px)
      prune_len: 20         # 잔가지 삭제 길이 (BEV px)
      dash_len: 40          # ★ 노란 점선 한 칸 길이 / m_per_px_y
      wdash_max_mm: 150     # 흰 점선 잇기: 이보다 짧은 흰 조각 = 점선 한 칸 (조각 10cm + 여유). 0이면 끔
      wdash_gap_mm: 150     # 조각 끝 사이가 이 안이면 이음 (빈칸 10cm + 여유)
      wdash_angle_deg: 30   # 같은 줄로 볼 방향 차이
      wdash_offset_mm: 40   # 같은 줄로 볼 옆 어긋남 (차선 사이 26cm보다 충분히 작게)
      max_lane_thick: 20    # ★ 차선 두께 / m_per_px_x 보다 여유 있게

    path:
      brick_always: 0        # 0: 벽돌은 공사 모드에서만 경로에 반영, 1: 항상 (아래 brick_* 값이 공사 모드 밖에서 쓰임)
      brick_depth_mm: 100    # ★ 벽돌 앞뒤 길이
      brick_margin_mm: 50   # ★ 박스 좌우 여유
      brick_gap_mm: 120     # 벽돌 끝과 차선 사이 이보다 좁은 틈은 벽으로 막음 (곡선에서 수평 박스가 남기는 틈). 0=끔
      det_max_age_ms: 300
      mem_travel_mm: 600    # 기억만으로 갈 수 있는 최대 거리
      max_dev_mm: 50        # 새 경로가 기억과 이만큼 넘게 다르면 의심
      override_frames: 10   # 의심이 이만큼 연속되면 새 경로를 믿음
      turn_override_frames: 0 # 좌/우 명령 중에는 이만큼만 의심 (0 = override_frames 그대로). 빠르게 달릴 때 교차로에서 기억으로 지나치지 않게
      turn_drop_memory: 1   # 1: 좌/우 명령이 새로 들어오면 직진 때 기억한 경로를 버림
      min_len_mm: 100       # 이보다 짧은 경로는 무효
      branch_look_mm: 40    # 분기에서 각 가지를 미리 보는 길이
      blind_max_mm: 250     # 사각지대를 연속으로 지날 수 있는 최대 길이
      fill_blind: 1         # 사각지대(로봇 ~ 화면 아래)를 지나온 경로로 채움: 0 끔, 1 직진 명령일 때만, 2 항상
      fill_join_mm: 40      # 지나온 경로와 지금 경로가 이보다 떨어져 있으면 안 채움
      turn_radius_mm: 150   # 교차로 ㄱ자 같은 급한 모서리를 이 반지름 원호로 (0=끔). 실측한 교차로 회전 반지름. 쓰면 drive.pivot_enter_deg 180 권장
      turn_min_deg: 45      # 앞뒤 6cm 사이에서 이보다 크게 꺾이는 곳만 (완만한 곡선은 그대로)

      # ── 공사 구간 (/mission/construction true로 진입: tb_brain이 표지판을 보고, 또는 GUI C키). 실측: 차폭 56cm, 벽돌 20x8cm 선에 붙어 좌우 번갈아, 빈 공간 40cm
      con_brick_depth_mm: 200  # 공사 구간 벽돌 벽 앞뒤 길이 (벽돌 8cm + 로봇 뒤가 벽돌 옆을 지날 여유)
      con_brick_margin_mm: 90  # 공사 구간 벽돌 벽 좌우 여유 (60은 벽돌 옆에 닿음)
      con_brick_w_mm: 200      # 벽돌 실제 가로. 선에 닿은 벽돌은 선에서 이만큼(+좌우 여유)만 벽으로 (박스는 옆면 때문에 넓게 잡힘)
      con_attach_mm: 300       # 선에 붙은 벽돌은 붙은 쪽을 벽돌의 모든 줄에서 이 거리 안의 선까지 막음 (곡선에서 벽돌-선 사이 주머니)
      con_extend_mm: 400       # 벽돌에 가려 끊긴 선을 끝 방향 그대로 이만큼 이음 (선 끝 8cm 안에 벽돌이 있을 때만. 0이면 끔)
      con_dead_end_mm: 250     # 끝이 벽에 막힌(화면 끝으로 안 열린) 가지가 이보다 짧으면 삭제. 벽돌-선 구석으로 가는 경로 방지 (0=끔)
      con_line_hug: 0          # 1 = 벽돌 옆에서 경로를 반대쪽 차선 쪽으로 붙임 (0 = 벽돌과 선 사이 한가운데, 예전과 같음)
      con_line_keep_mm: 140    #   로봇 중심 ~ 붙을 선 거리 (로봇 반폭 105mm + 여유)
      con_line_zone_mm: 250    #   경로 옆 이 거리 안에 벽돌이 있을 때만 옮김
      con_line_max_shift_mm: 120 # 최대로 옮기는 폭
      con_bridge_mm: 600       # 같은 쪽 벽돌 잇기: 앞 벽돌 뒷면~다음 벽돌 앞면이 이 안이면 사이(선 쪽)를 막음. 0 = 끔 (r-r-l 배치에서 1·2번 사이로 들어가는 것 방지)
      con_bridge_margin_mm: 50 #   이은 벽(보라)을 벽돌 안쪽 끝에서 길 쪽으로 더 막는 폭. 줄이면 보라 벽이 좁아짐
      con_bridge_dy_mm: 0      #   두 벽돌 안쪽 끝 차이가 이보다 크면 안 이음. 0 = 안 봄 (쪽은 벽돌이 붙은 선으로 정함)
      con_bridge_far_mm: 1000  #   이 거리 안이면 BEV보다 먼 벽돌도 잇기에 씀 (0 = BEV 안 벽돌만)
      con_bridge_far_dy_mm: 200 #  먼 벽돌이 낀 쌍은 안쪽 끝 차이가 이보다 크면 안 이음 (먼 벽돌은 선이 안 보여 쪽을 로봇 기준으로 정함, 0 = 안 봄)
      con_bridge_from_back: 0  #   1 = 앞 벽돌 뒷면부터 막음 (0 = 앞면부터, 벽돌 옆도 겹쳐 막음)
      con_keep: 0              # 화면에서 사라진 벽돌에서 경로 밀기: 0 끔, 1 그쪽으로 꺾지만 못하게(약), 2 벽돌에서 떼어 놓기(강)
      con_keep_rear_mm: 100    # 바퀴 축이 그 벽돌 뒷면을 지나고 이만큼 더 가야 그쪽으로 꺾음 (14cm=로봇 뒤 끝. 시뮬레이션 10cm에서도 4cm 여유)
      con_hold_mm: 40          # 로봇 뒤 끝이 그 벽돌을 지나고 이만큼 더 갈 때까지
      con_clear_mm: 30         # 그동안 벽돌 안쪽 끝과 로봇 옆면 사이 여유
      con_edge_mm: 60          # 양쪽 다 선에 안 닿은 벽돌(화면 밖 선에 붙음)의 끝이 화면 끝에서 이 안이면 화면 끝까지 막음
      con_smooth_mm: 80        # 공사 구간 경로 모서리를 이 폭으로 둥글게 (0이면 끔)
      con_exit_mm: 600         # 벽돌을 본 뒤 이만큼 가는 동안 벽돌이 안 보이면 일반 주행 (0 = 명령으로 끌 때까지)
      con_no_brick_mm: 2000 # 진입 후 벽돌을 한 번도 못 보고 이만큼 가면 공사 모드 끝 (표지판 오검출 대비, 0 = 끔)
      con_override_frames: 1   # 공사 구간: 새 경로가 기억과 달라도 이만큼만 의심 (벽돌이 갑자기 보이면 경로가 바뀌는 게 정상)
      con_cross_override_frames: 15  # 공사 구간: 새 경로와 기억 사이에 차선이 있으면(선 너머로 넘어감) 이만큼 연속으로 보여야 믿음, 0 끔
      con_straight_by_lane: 1  # 공사 구간: 직진 갈림길에서 보이는 차선 방향 기준으로 가장 곧은 가지
      con_offscreen_side: 0    # (끔 추천: 로봇이 틀어지면 반대로 판단해 벽돌에 붙어 감) 공사 구간: 화면 옆 끝까지 간 벽돌은 화면 밖 선에 붙은 것 (반대쪽 선과의 틈은 지나갈 길)

      # ── 정지선 (/mission/stop_line true 동안만: tb_brain이 빨간·노란불에서 켬)
      sl_margin_mm: 60      # 경로 끝 = 빨간선 - 이만큼 (바퀴 축 기준). 로봇 앞 끝 9cm, tb_drive stop_dist만큼 더 앞에서 멈춤
      one_line_min_px: 300     # 한쪽 선만 보임(/lane/one_line): 적은 쪽 색 픽셀이 이보다 적고
      one_line_main_px: 1000   #   많은 쪽이 이 이상일 때. tb_drive drive.one_line_v_mm_s로 감속
      sl_min_w_px: 60       # BEV 한 줄에 빨강이 이만큼 있어야 정지선으로 봄 (차로 폭 약 172px)
