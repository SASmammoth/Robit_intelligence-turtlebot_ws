path_node:
  ros__parameters:
    skel:
      seal_len: 30          # 끊긴 차선 끝 연장 (BEV px)
      prune_len: 20         # 잔가지 삭제 길이 (BEV px)
      dash_len: 40          # ★ 노란 점선 한 칸 길이 / m_per_px_y
      max_lane_thick: 20    # ★ 차선 두께 / m_per_px_x 보다 여유 있게

    path:
      brick_depth_mm: 100    # ★ 벽돌 앞뒤 길이
      brick_margin_mm: 50   # ★ 박스 좌우 여유
      brick_gap_mm: 120     # 벽돌 끝과 차선 사이 이보다 좁은 틈은 벽으로 막음 (곡선에서 수평 박스가 남기는 틈). 0=끔
      det_max_age_ms: 300
      mem_travel_mm: 600    # 기억만으로 갈 수 있는 최대 거리
      max_dev_mm: 50        # 새 경로가 기억과 이만큼 넘게 다르면 의심
      override_frames: 10   # 의심이 이만큼 연속되면 새 경로를 믿음
      min_len_mm: 100       # 이보다 짧은 경로는 무효
      branch_look_mm: 40    # 분기에서 각 가지를 미리 보는 길이
      blind_max_mm: 250     # 사각지대를 연속으로 지날 수 있는 최대 길이
      fill_blind: 1         # 사각지대(로봇 ~ 화면 아래)를 지나온 경로로 채움: 0 끔, 1 직진 명령일 때만, 2 항상
      fill_join_mm: 40      # 지나온 경로와 지금 경로가 이보다 떨어져 있으면 안 채움
      turn_radius_mm: 150   # 교차로 ㄱ자 같은 급한 모서리를 이 반지름 원호로 (0=끔). 실측한 교차로 회전 반지름. 쓰면 drive.pivot_enter_deg 180 권장
      turn_min_deg: 45      # 앞뒤 6cm 사이에서 이보다 크게 꺾이는 곳만 (완만한 곡선은 그대로)

      # ── 공사 구간 (/mission/construction true로 진입: tb_brain이 표지판을 보고, 또는 GUI C키). 실측: 차폭 56cm, 벽돌 20x8cm 선에 붙어 좌우 번갈아, 빈 공간 40cm
      con_brick_depth_mm: 200  # 공사 구간 벽돌 벽 앞뒤 길이 (벽돌 8cm + 로봇 뒤가 벽돌 옆을 지날 여유)
      con_brick_margin_mm: 90  # 공사 구간 벽돌 벽 좌우 여유 (60은 벽돌 옆에 닿음)
      con_brick_w_mm: 200      # 벽돌 실제 가로. 선에 닿은 벽돌은 선에서 이만큼(+좌우 여유)만 벽으로 (박스는 옆면 때문에 넓게 잡힘)
      con_attach_mm: 300       # 선에 붙은 벽돌은 붙은 쪽을 벽돌의 모든 줄에서 이 거리 안의 선까지 막음 (곡선에서 벽돌-선 사이 주머니)
      con_extend_mm: 400       # 벽돌에 가려 끊긴 선을 끝 방향 그대로 이만큼 이음 (선 끝 8cm 안에 벽돌이 있을 때만. 0이면 끔)
      con_dead_end_mm: 250     # 끝이 벽에 막힌(화면 끝으로 안 열린) 가지가 이보다 짧으면 삭제. 벽돌-선 구석으로 가는 경로 방지 (0=끔)
      con_keep: 1              # 화면에서 사라진 벽돌: 0 무시, 1 그쪽으로 꺾지만 못하게(약), 2 벽돌에서 떼어 놓기(강)
      con_keep_rear_mm: 100    # 바퀴 축이 그 벽돌 뒷면을 지나고 이만큼 더 가야 그쪽으로 꺾음 (14cm=로봇 뒤 끝. 시뮬레이션 10cm에서도 4cm 여유)
      con_hold_mm: 40          # 로봇 뒤 끝이 그 벽돌을 지나고 이만큼 더 갈 때까지
      con_clear_mm: 30         # 그동안 벽돌 안쪽 끝과 로봇 옆면 사이 여유
      con_edge_mm: 60          # 양쪽 다 선에 안 닿은 벽돌(화면 밖 선에 붙음)의 끝이 화면 끝에서 이 안이면 화면 끝까지 막음
      con_smooth_mm: 80        # 공사 구간 경로 모서리를 이 폭으로 둥글게 (0이면 끔)
      con_exit_mm: 600         # 벽돌을 본 뒤 이만큼 가는 동안 벽돌이 안 보이면 일반 주행 (0 = 명령으로 끌 때까지)
      con_no_brick_mm: 2000 # 진입 후 벽돌을 한 번도 못 보고 이만큼 가면 공사 모드 끝 (표지판 오검출 대비, 0 = 끔)
